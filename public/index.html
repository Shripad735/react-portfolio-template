<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      // Applied before first paint so a stored dark theme never flashes light.
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (error) {
          /* storage unavailable, the light default stands */
        }
      })();
    </script>

    <title>Shripad Khandare, Software Engineer</title>
    <meta
      name="description"
      content="Shripad Khandare is a computer engineer in Pune working on backend services, cloud infrastructure, and automation, with a growing focus on LLM and agentic applications."
    />
    <meta name="author" content="Shripad Khandare" />

    <link rel="icon" href="%PUBLIC_URL%/monogram.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="theme-color" content="#f7f6f2" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shripad Khandare, Software Engineer" />
    <meta
      property="og:description"
      content="Backend services, cloud infrastructure, automation, and practical work with LLMs."
    />
    <meta name="twitter:card" content="summary" />
  </head>

  </body>
</html>
